name: Build Bounce Tales APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Create debug.keystore and keystore.properties
      run: |
        # إنشاء مجلد .android إذا لم يكن موجودًا
        mkdir -p $HOME/.android
        
        # إنشاء مفتاح التوقيع (debug keystore)
        keytool -genkey -v -keystore $HOME/.android/debug.keystore \
          -alias androiddebugkey -storepass android -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
        
        # إنشاء ملف keystore.properties
        echo "storeFile=$HOME/.android/debug.keystore" > keystore.properties
        echo "storePassword=android" >> keystore.properties
        echo "keyAlias=androiddebugkey" >> keystore.properties
        echo "keyPassword=android" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleMidletRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BounceTales-APK
        path: app/build/outputs/apk/midlet/release/*.apk

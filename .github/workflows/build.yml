name: Build Bounce Tales APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install required SDK packages
      run: sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleMidletRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BounceTales-APK
        path: app/build/outputs/apk/midlet/release/*.apk
